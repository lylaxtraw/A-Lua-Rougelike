name: Unit Testing (Busted Framework)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Clone repo
        uses: actions/checkout@v4

      - name: Config LuaJIT
        uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: "luajit" # <-- Cambio aquí

      - name: Config LuaRocks
        uses: leafo/gh-actions-luarocks@v5

      - name: Install Busted Framework
        run: luarocks install busted

      - name: Run Tests
        run: busted spec/